# 日常 CI：每次推 main 与每个 PR 都跑类型检查与全量测试。
#
# 用 frozen 安装而非普通安装：前者严格按 lockfile 装，lockfile 与 package.json 不同步时直接失败
# —— 这正是我们要在 CI 里拦下的情况（本地曾用 --legacy-peer-deps 安装，导致 lockfile 缺自动
# peer，CI 首次运行即红）。`--config.node-linker=hoisted` 是正确性开关，不是性能选项（见文件尾）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v7 的 action 自带 node24 运行时；v4 声明 node20，该运行时已被 GitHub 弃用，
      # 会被强制切到 24 跑并在每次 run 顶部挂一条告警。
      - uses: actions/checkout@v7

      # pnpm 必须排在 setup-node 之前，否则 `cache: pnpm` 找不到 store。
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          # 版本基线以 .node-version 为唯一来源，避免 CI 与本机漂移。
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      # 版本号只写在 package.json 一处：pnpm-lock v9 不记录根包自身的版本，没有 npm 仓那种
      # 「lockfile 版本 == 清单版本」的交叉核对。「忘了 bump」由 release.yml 里「该版本已在 npm 上」
      # 那道幂等判据兜住。

      - run: pnpm run typecheck

      # `pnpm test` 自带 build：产物级测试（dist / client bundle）依赖 lib/ 已生成。
      - run: pnpm test

      - run: pnpm run lint

      # lint 此前已在跑，但格式没进 CI —— 本仓有 .prettierrc.json，此前只在本地手动跑。
      - name: Format check
        run: pnpm run format:check
  # 收口 job —— ruleset 的 required_status_checks 只配这一个名字（CI Success），
  # 本仓内部 job 增删时规则集无需改动。改本 job 前必读三条：
  #   1. 判定只放 step 级：放 job 级时条件为假会让本 job 变 skipped，
  #      而 GitHub 把 skipped 当 Success —— 那正好是我们要防的假绿。
  #   2. needs 必须列全本文件所有 job id；漏一个，那个 job 红了也照样放行。
  #   3. skipped 一并判红：本 workflow 没有合法的 if: 跳过，出现 skipped
  #      只可能是上游失败级联（上游同在 needs 里，会同时判红）。
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::有 job 未成功 —— CI Success 判红（原因见本 job 上方注释）"
          echo '${{ toJSON(needs) }}'
          exit 1

# 本文件跑在 hoisted linker 上。pnpm 默认的 symlink linker 解不开浏览器半边那几包的同侪关系，
# 症状是**测试看不见自己的依赖**而不是一条像样的报错。理由见 [AGENTS.md](../../AGENTS.md)。
