# 日常 CI：每次推 main 与每个 PR 都跑类型检查与全量测试。
#
# 用 `npm ci` 而非 `npm install`：前者严格按 lockfile 安装，lockfile 与 package.json
# 不同步时直接失败 —— 这正是我们要在 CI 里拦下的情况（本地曾用 --legacy-peer-deps 安装，
# 导致 lockfile 缺自动 peer，CI 首次运行即红）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v7 的 action 自带 node24 运行时；v4 声明 node20，该运行时已被 GitHub 弃用，
      # 会被强制切到 24 跑并在每次 run 顶部挂一条告警。
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 版本基线以 .node-version 为唯一来源，避免 CI 与本机漂移。
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # 版本号写在两处：package.json 决定发布号，package-lock.json 决定 npm ci 装的树。
      # 手工改前者会漏掉后者，所以在每次推送就拦，不必等到发 tag。
      - name: Verify the lockfile version matches package.json
        run: |
          pkg=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          if [ "$pkg" != "$lock" ]; then
            echo "::error::package-lock.json version $lock does not match package.json version $pkg"
            echo "bump with: npm version <patch|minor|major> --no-git-tag-version"
            exit 1
          fi

      - run: npm run typecheck

      # `npm test` 自带 build：产物级测试（dist / client bundle）依赖 lib/ 已生成。
      - run: npm test

      - run: npm run lint

      # 本次新增：lint 此前已在跑，但格式没进 CI —— 本仓有 .prettierrc.json，
      # `npx prettier --check .` 此前只在本地手动跑。
      - name: Format check
        run: npm run format:check
  # 收口 job —— ruleset 的 required_status_checks 只配这一个名字（CI Success），
  # 本仓内部 job 增删时规则集无需改动。改本 job 前必读三条：
  #   1. 判定只放 step 级：放 job 级时条件为假会让本 job 变 skipped，
  #      而 GitHub 把 skipped 当 Success —— 那正好是我们要防的假绿。
  #   2. needs 必须列全本文件所有 job id；漏一个，那个 job 红了也照样放行。
  #   3. skipped 一并判红：本 workflow 没有合法的 if: 跳过，出现 skipped
  #      只可能是上游失败级联（上游同在 needs 里，会同时判红）。
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::有 job 未成功 —— CI Success 判红（原因见本 job 上方注释）"
          echo '${{ toJSON(needs) }}'
          exit 1
