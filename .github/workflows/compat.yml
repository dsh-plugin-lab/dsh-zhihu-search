# DSH 兼容性（宿主防腐化）：盯住**宿主上游的版本线**。
#
# 与 contract.yml 同构、分工不同：那边盯知乎开放平台的行为指纹，这边盯 DSH 的 API 面。
# 两边都是会悄悄漂移的上游，一边红了不代表另一边有事，所以两条线各自独立、时间错开。
#
# ## 为什么用 dist-tag 而不是版本矩阵
#
# DSH 至今没有正式版，版本号本身不构成承诺，tag 才是。三个 tag 的语义**各不相同**
# （@deepseek-ai/dsh-* 全家族一致）：
#
#   next   —— **当前承诺线**。声明面（engines.dsh 与全部 27 条
#             @deepseek-ai/dsh-* 声明）里的 RC 族落在这一条上，形状见 package.json。
#             使用者按我们给的区间装得到、我们也只把它当必保的一条测。
#   旧 RC 族 —— 声明面里**承诺的第二族**（有真实使用者停在那里，见 .agents/notes/）。
#             实测**没有任何 dist-tag 指向它**，所以 compat-swap 用**版本前缀**定位这一族
#             （前缀值写在下面 record 矩阵里，那是机器消费的输入，不是散文）。
#             跑在 record 矩阵里（只记录不阻断），但它红要当回事 —— 那是对外承诺坏了。
#   alpha  —— 宿主早已停发的旧线，**不在**本仓声明面里（换到它上面等于装到我们不承诺的宿主）。
#             换包 + 跑全套；红了**只记录**（见下面 record job）。
#   latest —— **不可用**：多数 @deepseek-ai/dsh-* 包上它指向很早的版本，@deepseek-ai/dsh 自己
#             那条也未必落在本插件的声明里（具体值现查 npm view @deepseek-ai/dsh dist-tags）。
#             按默认方式装宿主会装到过期版本。
#
# ## 两条线的处理方式不同（2026-09-22 角色对调）
#
#   next 红了 = 使用者会装到 = **必须修** → 整个 run 红，会发通知（declaration / committed 两个 job）。
#   alpha 红了 = **记录，不阻断** → job 红、run 绿，不进跟踪 issue。
#
# 2026-09-24：承诺线回到 next —— 宿主把新线（rc 档）发在 next 上（alpha 停在旧档；具体值现查 npm view @deepseek-ai/dsh dist-tags），本仓推荐的配置界面下限也跟着那条线走。
# 2026-09-22 曾对调过一次（next 承诺 → alpha 承诺，当时理由是接缝只在 alpha 上）；方向怎么走，判据始终是
# 「声明面与推荐线落在哪」，而一条**长期必红**的周更任务会让「红 = 出事」的信号失效 —— 噪音掩盖真问题，比少一条巡逻更糟。
#
# 声明面（declaration）是这两条之外的一件事：它不跑任何代码，只问「我们声明的区间还罩不罩得住
# **README 告诉用户去装的那条线**」。那条线现在就是 next（本仓推荐的配置界面下限也在那里），
# 所以它**只查 next** —— 查一条我们自己都不再声明的线，红只会变成每周的噪音。
#
# ## 换线是「整棵树搬家」，两件事必须由脚本自己保证
#
#  1. **声明面整条同进同退**：`engines.dsh` 既不在依赖段里、名字也不带 `dsh-` 尾巴，
#     所以换包脚本单独处理它；只换依赖段会让 redlines 的「逐字相同」**每周必红**，
#     而那一条亮的恰好是能盖住真正不兼容点的位置。
#  2. **清掉换线前的残留再装**：一棵旧线的 `pnpm-lock.yaml`（或装了旧树的 node_modules）
#     会让安装直接失败，而失败之后 node_modules 停在旧版本上，后面每一步都绿。
#     清锁清树写在 `swap` 里，本地复现与 CI 走同一条路径。
#
# ## 声明面是**若干个族**的并集，换版只动其中一族
#
#  npm 的预发布语义：候选带预发布段时，只有区间里**同一个 major.minor.patch** 也带预发布段
#  才允许匹配。所以要同时承诺两族，单区间罩不住，必须用 `||` 显式枚举。
#  compat-swap 的换版语义随之是「**保留旧族、只替换目标族**」（`--drop <前缀>` 显式删族）。
#
#  这带来一条固有代价（写在决策记录里）：宿主再推一个**新的 major.minor.patch** 的预发布时，
#  这条并集不会自动罩住它，需要**手动加一族**再换 —— 跟多条预发布线就要付这份手动成本。
#
# 不挂 push：这条线看的是**上游**动没动，本地提交改不了结论。
name: Compat

on:
  schedule:
    # 每周一 02:00 UTC（北京时间 10:00）。与 contract.yml 的 01:00 错开：
    # 两条上游线同时红会分不清是谁漂了。
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 声明面：peer 范围还罩不罩得住**我们告诉用户去装的那条线**（next）。
  #
  # 单独成 job 的理由：它只读 package.json 再问 npm，几十秒出结果；而且它的结论
  # 与「代码还能不能跑」是两件事 —— 混在代码 job 里会被后者的红遮住，反过来也一样。
  declaration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # 不装任何东西：判据是「我们声明的区间能覆盖这条线上的版本」。
      #
      # **只查 next**：根 README 的「版本兼容」告诉使用者，需要配置界面就把宿主升到
      # package.json 的 engines.dsh 声明的版本 —— 那条线就是 next，而声明面本身也落在那里。
      # 判据是「声明区间必须罩得住我们告诉用户去装的那条线」。
      #
      # 判据只有一处实现（[scripts/check-declaration.mjs] 的 TRACKED_LINE = next）：它同时看
      # `engines.dsh` 与三个依赖段里每一条 `@deepseek-ai/dsh-*`，而换包脚本那边**不再自带
      # 一份同名判定** —— 两份实现判同一件事，迟早会各红各的。
      #
      # 曾经两条线都查。2026-09-22 起只查当时的承诺线 alpha；现在承诺线回到 next，而 alpha 那条已低于我们的下限，
      # 于是**长期必红**，而长期必红会让信号失效。
      - name: Declaration surface — the line the README points users at (next)
        id: declared
        run: node scripts/check-declaration.mjs

      - name: Summarize
        if: always()
        run: |
          {
            echo "## DSH 兼容性 · 声明面"
            echo ""
            echo "| 线 | check 结果 |"
            echo "| --- | --- |"
            echo "| next（承诺线 = README 让用户去装配置界面的那条线） | ${{ steps.declared.outcome }} |"
            echo ""
            echo "判据：声明区间必须能覆盖**我们告诉用户去装的那条线**（见根 README 的「版本兼容」）。"
            echo ""
            echo "红了怎么办：核对上游变更 → 放宽 peer 范围（形状见 package.json）→ 同步两份 README 的「前置」"
            echo "→ 按 docs/PUBLISHING.md 的 Q1/Q2 定档。范围放宽不改行为，Q1/Q2 全否即 **patch**，"
            echo "但必须发版（声明在产物里）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        if: always()
        run: |
          if [ "${{ steps.declared.outcome }}" != "success" ]; then
            echo "::error::声明面罩不住 next 线：check=${{ steps.declared.outcome }}。处理链见本次运行的 Summary。"
            exit 1
          fi

  # 记录线：**只记录，不阻断 run**。矩阵覆盖两条我们承诺但不是承诺线的族。
  #
  #   alpha      —— 宿主早已停发的那条旧线（高于我们的下限，但不再是任何承诺的一部分）。
  #   旧 RC 族 —— **声明面里承诺的第二族**（有真实使用者停在那里，见决策记录；
  #                 实测：没有任何 dist-tag 指向它，所以这里用**版本前缀**定位族
  #                 （compat-swap 的线参数既收 dist-tag 也收版本前缀）。
  #
  # 这两条红了不阻断 run（job 级 continue-on-error），但它们**必须真的跑** —— 承诺的那族是
  # 对外承诺的一部分，不跑就等于假绿。alpha 红是常态（它不在声明面里）。
  record:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # alpha 不在声明面里（见文件头），所以它换不动 —— swap 会以「声明面里没有这一族」
          # 明确报错停下。这本身就是一条信息：那条线已不在我们的承诺范围内。
          - line: alpha
            only: ''
          # 承诺的第二族：用**版本前缀**定位（实测没有任何 dist-tag 指向它），并 `--only`
          # 把声明面**临时收窄成只有这一族** —— 并集区间会被 npm 解析成「装匹配集里最高的那族」，
          # 不收窄就永远装不到低族（verify 会 18 项全红）。
          - line: 0.1.7-rc
            only: '--only 0.1.7-rc'
    name: record (${{ matrix.line }})
    steps:
      - uses: actions/checkout@v7

      # pnpm 必须排在 setup-node 之前，否则 `cache: pnpm` 找不到 store。
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # 刻意**不跑 frozen 安装**：要的是一棵按新声明重新解析出来的树。先装再改，包管理器会拿
      # 旧树去 reconcile，实测直接失败（exit 1）并且 node_modules 原封不动停在旧版本上 ——
      # 后面的测试于是全绿，报出一个假兼容。
      #
      # 一棵换线前的 `pnpm-lock.yaml` 同样会挡住解析。清锁清树因此写进 `swap` 自己：
      # 本地复现与 CI 走同一条路径，不指望调用方记得。
      #
      # 换包只替换**目标族**里的下限版本，其余族原样保留（声明面是两族并集，见脚本头部）；
      # `engines.dsh` 与依赖段同进同退，否则 redlines 的「逐字相同」每周必红。
      #
      # 这一步同时完成「装」与「核对实装版本」（`swap` 内部先跑一次不带 frozen 的安装，再跑 verify）：
      # 分开写会留下「只跑了前半段」的口子，而安装失败时 node_modules 会停在旧版本上，
      # 让后面每一步都绿。`--ignore-scripts` 是必须的：本包的 prepare 会跑 build（内含 tsc），
      # 类型面一漂移 tsc 就非零退出，install 本身失败，什么也测不到。构建由下面的步骤显式驱动。
      - name: Swap onto ${{ matrix.line }}, install, and confirm what got installed
        id: verify
        run: node scripts/compat-swap.mjs swap ${{ matrix.line }} ${{ matrix.only }}

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm run typecheck

      # 跑的是现有套件，一条新断言都不加。
      - name: Run the existing suite
        id: suite
        continue-on-error: true
        run: pnpm test

      # 只在套件红了之后跑，用来分流「类型面」与「行为面」：
      # pnpm test = build && vitest，tsc 一挂 vitest 根本不跑，会把「只有类型动了」误报成
      # 「整套挂了」。tsc 默认 noEmitOnError=false，报错仍会产出 lib/，所以这里能重建产物
      # 并真的跑到测试。
      - name: Diagnose — separate the type surface from the behaviour surface
        id: diagnose
        if: steps.suite.outcome == 'failure'
        continue-on-error: true
        run: |
          npx tsc || true
          npx tsc -p tsconfig.client.json || true
          node scripts/build-client.mjs
          npx vitest run --reporter=basic

      - name: Summarize
        if: always()
        run: |
          {
            echo "## DSH 兼容性 · 记录线 ${{ matrix.line }}（只记录）"
            echo ""
            echo "| 步骤 | 结果 |"
            echo "| --- | --- |"
            echo "| 换包 + 安装 + 核对装出来的版本 | ${{ steps.verify.outcome }} |"
            echo "| 类型面（pnpm run typecheck） | ${{ steps.typecheck.outcome }} |"
            echo "| 全量测试（pnpm test） | ${{ steps.suite.outcome }} |"
            if [ -n "${{ steps.diagnose.outcome }}" ] && [ "${{ steps.diagnose.outcome }}" != "skipped" ]; then
              echo "| 分流诊断（跳过 tsc 的类型面） | ${{ steps.diagnose.outcome }} |"
            fi
            echo ""
            echo "**红了怎么办**：先确认这不是「本来就该红」。记录线有两种情况："
            echo "  - **alpha**：它**不在**本仓声明面里（声明面是承诺族的并集），"
            echo "    红了只说明旧线装不出新接缝，不构成缺陷。真要看的是 next job 与 declaration job。"
            echo "  - **承诺的那族**：它是**声明面里承诺的一族**（有真实使用者停在那里），"
            echo "    所以红了**要当回事** —— 那说明我们对外承诺的兼容性真的坏了，按下面的链修。"
            echo ""
            echo "**若确实要查**（顺序不可颠倒）："
            echo ""
            echo "1. 先判类别 —— 三类红的处理完全不同："
            echo "   - **换包那一步或核对失败** → 树根本没换成，先解决安装问题再看别的（多半是上游包之间的 peer 冲突）。"
            echo "   - **类型面红** → 上游 API 签名变了。定位到具体包与符号，改调用点使其**新旧都能编译**"
            echo "     （2026-09-16 实测例子：agent/created 监听器显式 return undefined 即可同时满足"
            echo "     alpha 线与 next 线）。两版不可兼得时说明下限必须抬高，那是 Q2 是 → **major，先问人类**。"
            echo "   - **全量测试红** → **行为差异**，最重。按 test/README.md 的分层定位："
            echo "     L3b/L6a（native-web-tools / client-bundle / dist）说明平台语义变了；L1/L2 红则先怀疑"
            echo "     换包装错了 —— 那几层对宿主版本不敏感。"
            echo "2. 本地复现：clone 之后跑一遍 `node scripts/compat-swap.mjs swap ${{ matrix.line }}`（它自己改写声明面、清旧线残留、装、再核对）。"
            echo "3. 修 → 按 docs/PUBLISHING.md 定档 → 发版 → 等下一轮。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 各步都是 continue-on-error（为了拿到全部信号并让摘要一定跑得到），
      # 所以「有没有红」必须在这里显式汇总成 job 的成败。
      - name: Verdict
        if: always()
        run: |
          if [ "${{ steps.verify.outcome }}" != "success" ] || [ "${{ steps.typecheck.outcome }}" != "success" ] || [ "${{ steps.suite.outcome }}" != "success" ]; then
            echo "::error::${{ matrix.line }} 线漂移（换包=${{ steps.verify.outcome }}，类型面=${{ steps.typecheck.outcome }}，全量测试=${{ steps.suite.outcome }}）。这是**记录**不阻断 run；承诺的那族是对外承诺的一部分，它红要当回事。处理链见本次运行的 Summary。"
            exit 1
          fi

  # 承诺线（next）：红了**必须修**，会发通知。
  #
  # 2026-09-24 之前它是前瞻线（continue-on-error）；声明面落到 next 之后角色对调 ——
  # 使用者按我们的区间装到的就是这条线，它红了就是真出事。
  committed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 必须排在 setup-node 之前，否则 `cache: pnpm` 找不到 store。
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # 刻意**不跑 frozen 安装**：要的是一棵按新声明重新解析出来的树。先装再改，包管理器会拿
      # 旧树去 reconcile，实测直接失败（exit 1）并且 node_modules 原封不动停在旧版本上 ——
      # 后面的测试于是全绿，报出一个假兼容。
      #
      # 一棵换线前的 `pnpm-lock.yaml` 同样会挡住解析。清锁清树因此写进 `swap` 自己：
      # 本地复现与 CI 走同一条路径，不指望调用方记得。
      #
      # 换包只替换区间里的**下限版本**，运算符与上界原样保留 —— 声明面不会在 CI 里悄悄变形；
      # `engines.dsh` 与依赖段同进同退，否则 redlines 的「逐字相同」每周必红。
      #
      # 这一步同时完成「装」与「核对实装版本」（`swap` 内部先跑一次不带 frozen 的安装，再跑 verify）：
      # 分开写会留下「只跑了前半段」的口子，而安装失败时 node_modules 会停在旧版本上，
      # 让后面每一步都绿。`--ignore-scripts` 是必须的：本包的 prepare 会跑 build（内含 tsc），
      # 类型面一漂移 tsc 就非零退出，install 本身失败，什么也测不到。构建由下面的步骤显式驱动。
      # `--only <族前缀>` **不能省**（2026-10-12 实测）：并集区间下，安装器会在 `latest` 指向的
      # 版本能满足区间时优先用它，于是不收窄就会装出**混合树**，后面几步跑的不是承诺线那条族，
      # 而 `verify` 的红来自解析规则、不是宿主不兼容。姊妹仓 dsh-workbuddy-bridge 首跑即此。
      # （具体前缀是机器输入，写在下面的 run 里；这里不抄值。）
      #
      # ⚠️ 上面那三条成因最早是量 npm 的行为量出来的。迁到 pnpm 之后**逐条重测过**（2026-10-14），
      # 结论都仍然成立；实测记录见 scripts/compat-swap.mjs 的文件头。
      - name: Swap onto the next line, install, and confirm what got installed
        id: verify
        continue-on-error: true
        run: node scripts/compat-swap.mjs swap next --only 0.2.0

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm run typecheck

      - name: Run the existing suite
        id: suite
        continue-on-error: true
        run: pnpm test

      - name: Diagnose — separate the type surface from the behaviour surface
        id: diagnose
        if: steps.suite.outcome == 'failure'
        continue-on-error: true
        run: |
          npx tsc || true
          npx tsc -p tsconfig.client.json || true
          node scripts/build-client.mjs
          npx vitest run --reporter=basic

      - name: Summarize
        if: always()
        run: |
          {
            echo "## DSH 兼容性 · next 线（承诺线 = 我们声明的与使用者装到的那条线）"
            echo ""
            echo "| 步骤 | 结果 |"
            echo "| --- | --- |"
            echo "| 换包 + 安装 + 核对装出来的版本 | ${{ steps.verify.outcome }} |"
            echo "| 类型面 | ${{ steps.typecheck.outcome }} |"
            echo "| 全量测试 | ${{ steps.suite.outcome }} |"
            if [ -n "${{ steps.diagnose.outcome }}" ] && [ "${{ steps.diagnose.outcome }}" != "skipped" ]; then
              echo "| 分流诊断 | ${{ steps.diagnose.outcome }} |"
            fi
            echo ""
            echo "**红了怎么办**（顺序不可颠倒）："
            echo ""
            echo "1. 先判类别 —— 三类红的处理完全不同："
            echo "   - **换包那一步或核对失败** → 树根本没换成，先解决安装问题再看别的（多半是上游包之间的 peer 冲突）。"
            echo "   - **类型面红** → 上游 API 签名变了。定位到具体包与符号，先看能不能改调用点使其新旧都能编译"
            echo "     （compat.yml 的历史里记过一个例子：显式 return undefined 同时满足两条线）。"
            echo "     两版不可兼得时说明下限必须抬高，那是 Q2 是 → **major，先问人类**。"
            echo "   - **全量测试红** → **行为差异**，最重。按 test/README.md 的分层定位："
            echo "     L3b/L6a（native-web-tools / client-bundle / dist）说明平台语义变了；L1/L2 红则先怀疑"
            echo "     换包装错了 —— 那几层对宿主版本不敏感。"
            echo "2. 本地复现：clone 之后跑一遍 `node scripts/compat-swap.mjs swap <线>`（它自己改写声明面、清旧线残留、装、再核对）。"
            echo "3. 修 → 按 docs/PUBLISHING.md 定档 → 发版 → 等下一轮。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        if: always()
        run: |
          if [ "${{ steps.verify.outcome }}" != "success" ] || [ "${{ steps.typecheck.outcome }}" != "success" ] || [ "${{ steps.suite.outcome }}" != "success" ]; then
            echo "::error::next 线漂移（承诺线）：换包=${{ steps.verify.outcome }}，类型面=${{ steps.typecheck.outcome }}，全量测试=${{ steps.suite.outcome }}。处理链见本次运行的 Summary。"
            exit 1
          fi

  # 失败可见：定时任务的失败邮件 GitHub 自带，但它只发给最后改过 cron 的人，**不能当作主通知**。
  # 这里把「哪条线、哪一步红」写进一个**固定标题**的跟踪 issue：已存在就追加评论，不刷屏。
  #
  # 只收会红到使用者身上的两个 job：declaration（承诺还成不成立）与 next（代码能不能跑）。
  # alpha 刻意不进：它已低于声明下限，红是**记录**不是告警（见文件头与 record job）。
  report:
    needs: [declaration, committed]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      issues: write # 建 / 改跟踪 issue
    steps:
      - uses: actions/checkout@v7

      # 正文用英文（issue 是仓库对外的门面）；标题与标签固定，靠它们幂等。
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DECLARATION: ${{ needs.declaration.result }}
          COMMITTED: ${{ needs.committed.result }}
        run: |
          set -euo pipefail
          title='DSH compatibility patrol failed'
          label='compat'
          gh label create "$label" --description 'DSH compatibility patrol (see docs/PUBLISHING.md)' --color BFD4F2 --force >/dev/null

          body=$(cat <<EOF
          The DSH compatibility patrol failed. This fixed issue is updated instead of re-created.

          | Job | What it watches | Result |
          | --- | --- | --- |
          | declaration | the declared ranges vs the line the README points users at | ${DECLARATION} |
          | committed | the committed line: swap, typecheck, full suite | ${COMMITTED} |

          Run: ${RUN_URL}

          Criterion: the declared ranges must cover the lines we tell users they can install. The declared
          surface is a union of two prerelease families because npm only matches a prerelease candidate
          when the range carries a prerelease comparator of the same major.minor.patch.
          A red declaration means the declared ranges no longer reach the committed line (next); a red
          committed means the code no longer compiles or behaves on the line users are told to install.
          The record lines (alpha, which is outside the declared surface, and the older promised family,
          located by version prefix) run without blocking the run and are not reported here.

          Recovery: open the run summary, classify the failure, then widen the peer ranges, sync both READMEs,
          and ship a release - see docs/PUBLISHING.md, section "Compatibility" (兼容性). Close this issue once
          a patrol run is green again.
          EOF
          )

          number=$(gh issue list --state open --label "$label" --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            echo "Updating existing issue #$number"
            gh issue comment "$number" --body "$body"
          else
            echo "Creating the tracking issue"
            gh issue create --title "$title" --label "$label" --body "$body"
          fi
