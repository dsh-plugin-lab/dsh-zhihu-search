# pnpm workspace root. Declared even with a single package — otherwise pnpm treats this as a
# non-workspace directory and the dependency tree stops matching the one CI installs.
packages:
  - '.'

# pnpm 11 reads its settings from here, **not** from the `pnpm` field in package.json (that field is
# ignored, with a warning naming this file). Declared rather than answered at `pnpm approve-builds`
# so a fresh clone and CI get the same answer without anyone being prompted.
#
# esbuild's postinstall is what puts its platform binary in place. Blocked, the browser bundle step
# fails with a confusing "cannot find binary" instead of the real reason — hence an explicit yes.
# Every other dependency's build scripts stay blocked, which is the point of the allowlist.
allowBuilds:
  esbuild: true

# minimumReleaseAgeExclude：pnpm 11 的供应链门禁默认拒收「发布不足 24 小时」的版本，
# 而本仓跟的是宿主的 rc 线 —— 刚发布的 rc 天然落在 24 小时内，不放行就装不上
# （本机与 CI 同样停在 install，报 ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION）。
#
# 逐条列出被拒的那批宿主包，而不是把整道门禁关掉：门禁对**其余每个包**继续生效。
# 清单由 pnpm 自己报出来，抬宿主线时照抄一轮即可。
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.2.2-rc.3'
  - '@deepseek-ai/dsh-app-boot@0.2.2-rc.3'
  - '@deepseek-ai/dsh-atomic-write@0.2.2-rc.3'
  - '@deepseek-ai/dsh-brand@0.2.2-rc.3'
  - '@deepseek-ai/dsh-client-locale@0.2.2-rc.3'
  - '@deepseek-ai/dsh-client-ui-plugin-manager@0.2.2-rc.3'
  - '@deepseek-ai/dsh-client-ui-primitives@0.2.2-rc.3'
  - '@deepseek-ai/dsh-client-ui-renderer@0.2.2-rc.3'
  - '@deepseek-ai/dsh-client-ui-settings@0.2.2-rc.3'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.2-rc.3'
  - '@deepseek-ai/dsh-config-editor@0.2.2-rc.3'
